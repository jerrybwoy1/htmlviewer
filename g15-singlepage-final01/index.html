<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>debooger2000</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#20252a}.boot{min-height:100vh;display:grid;place-items:center}.boot div{background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:18px 22px;font-size:13px}</style></head><body><div class="boot"><div>Opening debooger2000…</div></div><script>(async()=>{try{const names=["app.part01.txt", "app.part02.txt", "app.part03.txt", "app.part04.txt", "app.part05.txt", "app.part06.txt", "app.part07.txt", "app.part08.txt", "app.part09.txt", "app.part10.txt", "app.part11.txt", "app.part12.txt"];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const raw=atob(parts.join('').trim());const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('This browser needs DecompressionStream support.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div>Could not open DEBOOGER: '+String(e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div></div>'}})();</script></body></html>
