<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>debooger2000</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#20252a}.boot{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.boot div{background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:18px 22px;font-size:13px}</style></head><body><div class="boot"><div>Opening debooger2000…</div></div><script>(async()=>{try{const names=["p01.txt","p02.txt","p03a.txt","p03b.txt","p03c.txt","p03d.txt","p03e.txt","p03f.txt","p03g.txt","p03h.txt"];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const raw=atob(parts.join('').trim()),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('This browser needs DecompressionStream support.');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div>Could not open DEBOOGER: '+String(e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div></div>'}})();</script></body></html>
