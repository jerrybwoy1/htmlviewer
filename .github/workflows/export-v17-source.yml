name: Export v17 source
on:
  push:
    branches: [debooger-v18-work]
    paths:
      - '.github/workflows/export-v17-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current v17 HTML
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip
          names = [
              'p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt','p09.txt','p10.txt','p11.txt',
              'p120.txt','p121.txt','p122.txt','p130.txt','p131.txt','p132.txt','p140.txt','p141.txt','p142.txt','p150.txt','p151.txt','p152.txt'
          ]
          root = Path('v17-clean-final')
          payload = ''.join((root / n).read_text(encoding='utf-8').strip() for n in names)
          payload += '=' * ((4 - len(payload) % 4) % 4)
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('DEBOOGER2000-v17-current-source.html').write_text(html, encoding='utf-8')
          print('reconstructed bytes', len(html.encode('utf-8')))
      - uses: actions/upload-artifact@v4
        with:
          name: debooger-v17-source
          path: DEBOOGER2000-v17-current-source.html
          retention-days: 1
