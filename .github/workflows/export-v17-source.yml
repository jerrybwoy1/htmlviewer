name: Export v17 source
on:
  push:
    branches: [debooger-v18-work]
    paths:
      - '.github/workflows/export-v17-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current v17 HTML
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, re
          loader = Path('index.html').read_text(encoding='utf-8')
          names = re.findall(r'v17-clean-final/([^"\']+?\.txt)', loader)
          print('chunks', names)
          root = Path('v17-clean-final')
          payload = ''.join((root / n).read_text(encoding='utf-8') for n in names).strip()
          payload = ''.join(payload.split())
          payload += '=' * ((4 - len(payload) % 4) % 4)
          packed = base64.b64decode(payload, validate=True)
          print('payload chars', len(payload), 'packed bytes', len(packed), 'header', packed[:4].hex())
          html = gzip.decompress(packed).decode('utf-8')
          Path('DEBOOGER2000-v17-current-source.html').write_text(html, encoding='utf-8')
          print('reconstructed bytes', len(html.encode('utf-8')))
      - uses: actions/upload-artifact@v4
        with:
          name: debooger-v17-source
          path: DEBOOGER2000-v17-current-source.html
          retention-days: 1
