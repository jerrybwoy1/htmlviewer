name: Publish DEBOOGER2000 Build003 Verified

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-debooger-build003.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact tested Build003
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,re,shutil

          FINAL_SHA='063c5ab084145c9b21c42c4ca7d71d9b6d633d9c9d5976d575f68c5b88fde5fb'
          TS_SHA='6469b2426802dc695e374f933d79555a13d47acc8a37dd0c9a4df63d16d9a38e'
          SHELL_SHA='d6e12c8078f087c9e34488890ee7dfdacd09219ec37e7d6a31c55051cce700a8'
          SOURCE_SHA='93973b83509c748ab02a12a8cb8d824a619fafa54058227303367d28df7948e0'
          ORDER=['js/app.js','js/audit-engine.js','js/device-engine.js','js/preview-helper.js','js/project-engine.js','js/provider-settings.js','js/storage.js']
          payload=Path('build003-payload')

          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def unpack(path):
              raw=base64.b64decode(Path(path).read_text().strip())
              return gzip.decompress(raw).decode()

          old_parts=sorted(Path('v18-clean-final').glob('p*.txt'))
          if not old_parts: raise SystemExit('v18 release chunks not found')
          old_raw=base64.b64decode(''.join(p.read_text().strip() for p in old_parts))
          old_html=gzip.decompress(old_raw).decode()
          m=re.search(r'<script id="debooger-typescript-source">(.*?)</script>',old_html,re.S)
          if not m: raise SystemExit('TypeScript compiler payload not found')
          ts=m.group(1)
          if sha(ts)!=TS_SHA: raise SystemExit('TypeScript compiler hash mismatch')

          shell=unpack(payload/'shell-001.b64')
          if sha(shell)!=SHELL_SHA: raise SystemExit('Build003 shell hash mismatch')

          obj={}
          for name in ORDER:
              raw=unpack(payload/(Path(name).name+'.b64'))
              obj[name]=base64.b64encode(raw.encode()).decode()
          source_json=json.dumps(obj,separators=(',',':'))
          if sha(source_json)!=SOURCE_SHA: raise SystemExit('Build003 SOURCE hash mismatch')

          if shell.count('__SOURCE_JSON__')!=1 or shell.count('__TS__')!=1:
              raise SystemExit('Build003 template placeholders invalid')
          html=shell.replace('__SOURCE_JSON__',source_json).replace('__TS__',ts)
          if sha(html)!=FINAL_SHA: raise SystemExit('FINAL BUILD003 HASH MISMATCH')

          out=Path('build003-clean-final')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()
          encoded=base64.b64encode(gzip.compress(html.encode(),compresslevel=9)).decode()
          chunk_size=120000
          names=[]
          for i in range(0,len(encoded),chunk_size):
              name=f'p{len(names)+1:03d}.txt'; names.append(name)
              (out/name).write_text(encoded[i:i+chunk_size])
          (out/'manifest.json').write_text(json.dumps({'final_sha256':FINAL_SHA,'bytes':len(html.encode()),'chunks':names},indent=2)+'\n')

          loader='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f5"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>debooger2000</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f5;color:#23272b}.boot{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.boot div{background:#fff;border:1px solid #dde3dd;border-radius:12px;padding:18px 22px;font-size:13px}</style></head><body><div class="boot"><div>Opening debooger2000…</div></div><script>(async()=>{try{const names=__NAMES__;const parts=await Promise.all(names.map(n=>fetch('build003-clean-final/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const raw=atob(parts.join('').trim()),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('This browser needs DecompressionStream support.');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div>Could not open DEBOOGER: '+String(e.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div></div>'}})();</script></body></html>'''
          Path('index.html').write_text(loader.replace('__NAMES__',json.dumps(names,separators=(',',':'))))
          print('Verified exact Build003:',FINAL_SHA,'chunks:',len(names))
          PY
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build003-clean-final index.html
          if git diff --cached --quiet; then
            echo "Release already published"
          else
            git commit -m "Publish DEBOOGER2000 build003 verified"
            git push
          fi
