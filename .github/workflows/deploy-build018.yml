name: Deploy build 018 final

on:
  push:
    branches:
      - agent/deploy-build-018-final

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify final ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/build018.part* > /tmp/build018.b64
          base64 --decode /tmp/build018.b64 > /tmp/build018.zip
          echo "c4a28f54750bf1272d75134c1245a1fe2ede65854e41b1db10e1579a0b4c8b8a  /tmp/build018.zip" | sha256sum -c -
          rm -rf /tmp/build018
          mkdir -p /tmp/build018
          unzip -q /tmp/build018.zip -d /tmp/build018

          ROOT=/tmp/build018/htmlviewer-debooger2000-build-018
          test -f "$ROOT/index.html"
          test -f "$ROOT/css/app.css"
          test -f "$ROOT/js/app.js"
          test -f "$ROOT/js/audit-engine.js"
          test -f "$ROOT/js/device-engine.js"
          test -f "$ROOT/js/project-engine.js"
          test -f "$ROOT/js/provider-settings.js"
          test -f "$ROOT/js/storage.js"
          test -f "$ROOT/js/preview-helper.js"

          ACTUAL="$(cd "$ROOT" && find . -type f -print | sort)"
          EXPECTED="$(printf '%s\n' \
            './css/app.css' \
            './index.html' \
            './js/app.js' \
            './js/audit-engine.js' \
            './js/device-engine.js' \
            './js/preview-helper.js' \
            './js/project-engine.js' \
            './js/provider-settings.js' \
            './js/storage.js')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Replace production tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/build018/htmlviewer-debooger2000-build-018
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          ACTUAL="$(find . -type f ! -path './.git/*' -print | sort)"
          EXPECTED="$(printf '%s\n' \
            './css/app.css' \
            './index.html' \
            './js/app.js' \
            './js/audit-engine.js' \
            './js/device-engine.js' \
            './js/preview-helper.js' \
            './js/project-engine.js' \
            './js/provider-settings.js' \
            './js/storage.js')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Publish exact build 018 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy DEBOOGER2000 build 018 final"
          git push origin HEAD:main
