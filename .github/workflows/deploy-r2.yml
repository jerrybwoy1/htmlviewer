name: Deploy DEBOOGER2000 build 018 R2

on:
  push:
    branches:
      - agent/deploy-build-018-r2-exact

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify R2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .r2patch/part* > /tmp/r2.patch
          echo "ab46fdf1835b169acc96f8dda4953d4c23f32b605868fe441ad7a670a3b8330c  /tmp/r2.patch" | sha256sum -c -
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch

          test "$(git hash-object index.html)" = "83f64000bad8afb3ec22c5619947de4154bc7f67"
          test "$(git hash-object css/app.css)" = "4ef30cd5096f1c838931622bb408b11077118ff4"
          test "$(git hash-object js/app.js)" = "6d93e3885d0a996abf7f6eb8d52f021ad6290377"
          test "$(git hash-object js/audit-engine.js)" = "2feda5143dacc55b4ece38a98af183ed35ce386f"
          test "$(git hash-object js/preview-helper.js)" = "9b9cdec48a940ac9b2c4e9b9f15b294004262e32"
          test "$(git hash-object js/project-engine.js)" = "8f0f60bd9417e0cf73bd0cb94f201df52c350f77"
          test "$(git hash-object js/provider-settings.js)" = "5f89c691246edfff9353fe081258e0444288c5fc"
          test "$(git hash-object js/storage.js)" = "610092b137c0dd5831f378bad8e73e08bfb50456"
          test "$(git hash-object js/device-engine.js)" = "8e925df5af39cf5877e4d0c5c78a05fd40487e1d"

      - name: Publish exact R2 to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .r2patch .github
          ACTUAL="$(find . -type f ! -path './.git/*' -print | sort)"
          EXPECTED="$(printf '%s\n' \
            './css/app.css' \
            './index.html' \
            './js/app.js' \
            './js/audit-engine.js' \
            './js/device-engine.js' \
            './js/preview-helper.js' \
            './js/project-engine.js' \
            './js/provider-settings.js' \
            './js/storage.js')"
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy DEBOOGER2000 build 018 R2"
          git push origin HEAD:main
