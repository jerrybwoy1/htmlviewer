name: Deploy audited MobileClean B005
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install audited B005 tree
        shell: bash
        run: |
          cat > /tmp/b005.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...][... ELLIPSIZATION ...][... ELLIPSIZATION ...][... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/b005.b64 > /tmp/b005.zip
          test "$(sha256sum /tmp/b005.zip | awk '{print $1}')" = "04abe7ab2aaaec88d489c3b3f1318fd307836de9febbd7b838f6e9ac28ce2f2e"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/b005.zip -d .
          for f in *.js; do node --check "$f"; done
          grep -q 'MobileClean B005' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy audited MobileClean B005 with mobile session recovery'
          git push origin HEAD:main
