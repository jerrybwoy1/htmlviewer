name: Package Build 020
on:
  pull_request:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        run: |
          mkdir -p dist/debooger2000-build-020-native-upload
          cp index.html dist/debooger2000-build-020-native-upload/
          cp -R css dist/debooger2000-build-020-native-upload/
          cp -R js dist/debooger2000-build-020-native-upload/
      - uses: actions/upload-artifact@v4
        with:
          name: debooger2000-build-020-native-upload
          path: dist/debooger2000-build-020-native-upload
          if-no-files-found: error
